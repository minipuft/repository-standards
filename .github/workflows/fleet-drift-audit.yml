name: Fleet Drift Audit

# Runs weekly, on demand, and whenever a release is published: a release is the moment every
# member falls one version behind, and the audit fails on that lag (scripts/audit-fleet.mjs).
# Release Please publishes with a personal token (RELEASE_PLEASE_TOKEN, release-please.yml), which
# is what lets the `release` event start this workflow. Its fallback, the workflow token, starts no
# workflows, so without that secret the release trigger is silent and the weekly run still catches
# the lag.
on:
  schedule:
    - cron: "17 6 * * 1"
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: Fleet Drift Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The audit resolves the latest release's commit, and names the release each downstream
          # pin points at, from local tags. A depth-1 checkout carries none.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Audit public fleet state
        id: audit
        continue-on-error: true
        env:
          FLEET_AUDIT_TOKEN: ${{ secrets.FLEET_AUDIT_TOKEN }}
        run: node scripts/audit-fleet.mjs --output fleet-report.md
      - name: Update drift dashboard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="Fleet Drift Dashboard"
          issue=$(gh api -X GET "repos/$GITHUB_REPOSITORY/issues" -f state=open --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)
          if [[ -n "$issue" ]]; then
            jq -Rs '{body: .}' fleet-report.md |
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/$issue" --input - >/dev/null
          else
            jq -Rs --arg title "$title" '{title: $title, body: .}' fleet-report.md |
              gh api -X POST "repos/$GITHUB_REPOSITORY/issues" --input - >/dev/null
          fi
      - name: Enforce audit result
        if: steps.audit.outcome != 'success'
        run: exit 1
