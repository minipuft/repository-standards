name: Verify consumer contract
description: Validate a downstream contract and its installed claude-prompts artifact
inputs:
  profile:
    description: Registered downstream profile
    required: true
  contract-path:
    description: Contract path relative to the consumer workspace
    required: false
    default: downstream-contract.json
  workspace:
    description: Consumer workspace path
    required: false
    default: .
runs:
  using: composite
  steps:
    - name: Set up Node 24
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: "24"
        package-manager-cache: false
    - name: Install verifier dependencies
      shell: bash
      run: npm ci --ignore-scripts --prefix "$GITHUB_ACTION_PATH/../.."
    - name: Verify consumer
      shell: bash
      run: >-
        node "$GITHUB_ACTION_PATH/verify-consumer.mjs"
        --workspace "${{ inputs.workspace }}"
        --contract "${{ inputs.contract-path }}"
        --profile "${{ inputs.profile }}"
